version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder # Use builder stage for dev dependencies
    volumes:
      - ./src:/app/src
    command: npm run start:dev # or ts-node-dev
    environment:
      NODE_ENV: development
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
